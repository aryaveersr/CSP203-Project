<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Notes - CampusHub</title>
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/notes_create.css" />
  </head>
  <body>
    <header>
      <a href="/" class="logo">
        Campus
        <span class="primary-accent">Hub</span>
      </a>
      <nav>
        <a href="/">Home</a>
        <a href="/events">Events</a>
        <a href="/notes">Notes</a>
      </nav>
    </header>

    <main class="notes-container">
      <div class="form-header">
        <h1>Create New Note</h1>
        <p class="form-desc">
          Share your lecture notes, tutorial summaries, or revision guides with
          fellow students.
        </p>
      </div>

      <form
        id="notes-form"
        class="notes-card"
        method="POST"
        enctype="multipart/form-data"
        action="/api/create_note"
      >
        <div class="form-group">
          <label for="title">
            Course Code
            <span class="required">*</span></label
          >
          <input
            type="text"
            id="code"
            name="code"
            placeholder="e.g., CSP203"
            required
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <label for="title">
            Note Title
            <span class="required">*</span>
          </label>
          <input
            type="text"
            id="title"
            name="title"
            placeholder="e.g., Data Structures & Algorithms Summary"
            required
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <label for="author"> Author / Contributor </label>
          <input
            type="text"
            id="author"
            name="author"
            placeholder="e.g., Aryan Sharma"
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label for="content"> Note Content </label>
          <textarea
            id="content"
            name="content"
            rows="10"
            placeholder="Write or paste your notes, key formulas, bullet points, or reference links here..."
          ></textarea>
        </div>

        <div class="form-group">
          <label for="files"> Attach Files </label>
          <input type="file" id="files" name="files" multiple />
        </div>

        <div class="form-actions">
          <a href="/" class="btn-cancel">Cancel</a>
          <button type="submit" class="btn-submit">Publish Note →</button>
        </div>
      </form>
    </main>

    <footer>
      <p>© 2026 CampusHub · Indian Institute of Technology Bhilai</p>
    </footer>
  </body>
</html>
